# Modello di configurazione per deploy.py.
# Copia questo file in 'deploy_config.ini' e inserisci le credenziali reali.
# 'deploy_config.ini' e' ignorato da git: NON verra' versionato.
#
# Puoi anche usare un percorso qualsiasi e passarlo con:  python deploy.py -c percorso/al/file.ini

[ftp]
host = ftp.tuosito.it
port = 21
user = IL_TUO_UTENTE
password = LA_TUA_PASSWORD
use_tls = false
passive = true
# Cartella del server in cui pubblicare il contenuto di public/ (default: /htdocs/wfp/).
remote_dir = /htdocs/wfp/
